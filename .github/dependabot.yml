version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  # the scripts have no runtime dependencies; this watches for any that are added later
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # the Obsidian screenshot tool pins Playwright
  - package-ecosystem: npm
    directory: /scripts/screenshot
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /editors/jetbrains
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      gradle:
        patterns: ["*"]
